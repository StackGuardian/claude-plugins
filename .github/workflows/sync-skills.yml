name: sync-skills

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: StackGuardian/stackguardian-mcp
          path: upstream
      - id: upstream
        run: echo "sha=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: scripts/sync-skills.sh upstream
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-skills
          add-paths: plugins/stackguardian
          commit-message: "chore: sync skills from stackguardian-mcp@${{ steps.upstream.outputs.sha }}"
          title: "chore: sync skills from stackguardian-mcp@${{ steps.upstream.outputs.sha }}"
          body: Copies the `sg-*` skills from StackGuardian/stackguardian-mcp and bumps the plugin's patch version so installs pick them up.
